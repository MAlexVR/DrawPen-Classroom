name: Release Installers
run-name: Release ${{ github.ref_name }}

# Releases for this community derivative are published deliberately after
# validation on Fedora 44 COSMIC. Manual dispatch avoids publishing untested
# cross-platform installers with the upstream signing configuration.
on:
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only unless a workflow explicitly asks
# for more; electron-forge's GitHub publisher needs write access to create
# the release, or it fails with "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  linux:
    name: Build for Linux (Fedora COSMIC compatibility)

    strategy:
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install X11 and RPM build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libx11-dev libxext-dev rpm

      - name: Build X11 input-shape helper
        run: ./tools/linux/build-input-shape.sh

      - run: npm install

      - name: Run Publish
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish

  windows:
    name: Build for Windows

    strategy:
      matrix:
        os: [windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # - name: Install Dependencies
      #   # For some reason cmake.js sometimes skips the build step in CI on Windows in this
      #   # case. So we install and execute cmake.js manually.
      #   run: |
      #     npm install cmake-js -g
      #     npx cmake-js install
      #     npm install

      - run: npm install

      - name: Run Publish
        env:
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
